name: CI Pipeline

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache PIP dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: $${{ runner.os }}-pip-$${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the package in "editable" mode (-e) so changes reflect immediately
          # This installs 'app' and its dependencies
          pip install -e ".[dev]"

      - name: Run Linting (Optional but recommended)
        run: |
          python -m pip install flake8 black
          # Check syntax
          flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Check formatting (optional)
          # black --check app tests

      - name: Run tests with coverage
        run: |
          # The pyproject.toml handles the --cov flags, but we can override if needed
          pytest --cov=app --cov-report=html --cov-report=xml --cov-report=term-missing -v

      - name: Verify Coverage Files Exist
        run: |
          ls -la coverage.xml 2>/dev/null || echo "coverage.xml not found"
          ls -la htmlcov/ 2>/dev/null || echo "htmlcov/ not found"

      # - name: Upload coverage to Codecov
      #   uses: codecov/codecov-action@v4
      #   with:
      #     file: ./coverage.xml
      #     flags: unittests
      #     name: codecov-umbrella
      #     fail_ci_if_error: false
      # token: ${{ secrets.CODECOV_TOKEN }}  # Uncomment if you have strict token requirements

      - name: Upload Test Artifacts (Optional)
        uses: actions/upload-artifact@v4
        if: always()  # Upload even if tests fail
        with:
          name: coverage-$${{ matrix.python-version }}-$${{ github.sha }}
          path: |
            coverage.xml
            htmlcov/
          retention-days: 7
          if-no-files-found: warn
