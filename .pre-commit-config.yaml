repos:
  # 1. Basic safety checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace     # Remove trailing spaces
      - id: end-of-file-fixer       # Ensure files end with a newline
      - id: check-yaml              # Validate YAML files
      - id: check-added-large-files # Prevent huge files (>500KB)
      - id: check-merge-conflict    # Check for merge conflict markers

  # 2. Code Formatting (Black)
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3

  # 3. Import Sorting (isort) - Optional but recommended with Black
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        #args: ["--profile", "black"]

  # 4. Linting (Flake8)
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        additional_dependencies: [flake8-docstrings]
        #args: [--max-line-length=88, --extend-ignore=E203,W503]

  # 5. Static Type Checking (Mypy)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies: [types-flask]
        #args: [--ignore-missing-imports]

  # 6. Run Tests (Optional - can be slow)
  # Note: Running full tests on every commit can be slow.
  # Many teams run this only on push or via CI.
  # Uncomment if you want it on every commit:
  # - repo: local
  #   hooks:
  #     - id: pytest
  #       name: Run Tests
  #       entry: pytest
  #       language: system
  #       pass_filenames: false
  #       always_run: true
